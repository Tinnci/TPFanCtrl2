name: Release
 
on:
  push:
    tags:
      - 'v*'
 
jobs:
  build:
    runs-on: windows-latest
 
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
 
      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
 
      - name: Get xmake cachedir
        id: xmake-cachedir
        run: echo "dir=$(xmake l -c 'print(global.get("cachedir"))')" >> $GITHUB_OUTPUT
        shell: bash
 
      - name: Cache xmake
        uses: actions/cache@v4
        with:
          path: ${{ steps.xmake-cachedir.outputs.dir }}
          key: ${{ runner.os }}-xmake-v1-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            ${{ runner.os }}-xmake-v1-
 
      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
 
      - name: Get Version
        id: get_version
        run: |
          VERSION=$(xmake l -c "import('core.project.project'); print(project.version())")
          if [ -z "$VERSION" ]; then echo "Error: Version extraction failed"; exit 1; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash
 
      - name: Configure and Build
        run: |
          xmake f -m release -a x86 -y
          xmake -y TPFanCtrl2
          xmake -y logic_test
          xmake -y core_test
 
      - name: Run Tests
        run: |
          xmake run logic_test
          xmake run core_test
 
      - name: Prepare Artifacts
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          ./scripts/package-release.ps1 -Version $ver -Configuration release -Architecture x86
        shell: pwsh
 
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TPFanCtrl2-Windows-x86
          path: |
            artifacts/dist/packages/*.zip
            artifacts/dist/manifest.json
 
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: TPFanCtrl2-Windows-x86
          path: ./release_assets
 
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/*.zip
            release_assets/manifest.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
