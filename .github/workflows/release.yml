name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Get xmake cachedir
        id: xmake-cachedir
        run: echo "dir=$(xmake l -c 'print(global.get("cachedir"))')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache xmake
        uses: actions/cache@v4
        with:
          path: ${{ steps.xmake-cachedir.outputs.dir }}
          key: ${{ runner.os }}-xmake-v1-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            ${{ runner.os }}-xmake-v1-

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Get Version from Tag
        id: get_version
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ]; then
            VERSION=$(xmake l -c "import('core.project.project'); print(project.version())")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Configure and Build (x86)
        run: |
          xmake f -m release -a x86 -y
          xmake -y TPFanCtrl2
          xmake -y TPFanCtrl2-cli
          xmake -y logic_test
          xmake -y core_test

      - name: Run Tests
        run: |
          xmake run logic_test
          xmake run core_test

      - name: Package Release (x86)
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          ./scripts/package-release.ps1 -Version $ver -Configuration release -Architecture x86
        shell: pwsh

      - name: Build Native CLI (x64)
        run: |
          xmake f -m release -a x64 --gui=n --tests=n -y
          xmake -y TPFanCtrl2-cli

      - name: Package Release (x64)
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          ./scripts/package-release.ps1 -Version $ver -Configuration release -Architecture x64
          
          # Bundle WinGet manifests for easy distribution/PR submission
          $manifestDir = "packaging/winget/manifests/t/Tinnci/TPFanCtrl2/$ver"
          if (Test-Path -LiteralPath $manifestDir) {
            $wingetZip = "artifacts/dist/packages/TPFanCtrl2-v$ver-winget-manifests.zip"
            Compress-Archive -Path (Join-Path $manifestDir "*") -DestinationPath $wingetZip -Force
          }
        shell: pwsh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TPFanCtrl2-Release-Assets
          path: |
            artifacts/dist/packages/*.zip
            artifacts/dist/manifest.json

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: TPFanCtrl2-Release-Assets
          path: ./release_assets

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release_assets/**/*.zip
            release_assets/**/manifest.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
